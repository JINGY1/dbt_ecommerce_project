
name: 'ecommerce_project'
version: '1.0.0'

profile: 'ecommerce_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:        
  - "target"
  - "dbt_packages"


# Configuring models
models:
  ecommerce_project:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

vars:
  segment_high_value_usd: 190   # ≈ top 10% of buyers by lifetime value
  segment_lapsed_days: 365


# Seeds configuration
seeds:
  ecommerce_project:
    raw_loyalty_members:
      +column_types:
        member_no: string
        contact_email: string
        phone: string
        home_country: string
        joined_ts: timestamp
    raw_store_orders:
      +column_types:
        order_id: string
        customer_id: int64
        guest_email: string
        order_ts: timestamp
        amount_usd: numeric
    country_codes:
      +column_types:
        country_name: string
        country_code: string
